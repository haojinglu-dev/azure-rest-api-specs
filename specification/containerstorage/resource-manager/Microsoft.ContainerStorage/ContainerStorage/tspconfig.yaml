emit:
  - "@azure-tools/typespec-autorest"
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
  disable:
    "@azure-tools/typespec-azure-resource-manager/arm-common-types-version": "New rule"
options:
  "@azure-tools/typespec-autorest":
    azure-resource-provider-folder: "resource-manager"
    emit-common-types-schema: "never"
    emitter-output-dir: "{project-root}"
    output-file: "{version-status}/{version}/containerstorage.json"
    arm-types-dir: "{project-root}/../../../../common-types/resource-management"
  "@azure-tools/typespec-go":
    service-dir: "sdk/resourcemanager/containerstorage"
    emitter-output-dir: "{output-dir}/{service-dir}/armcontainerstorage"
    module: "github.com/Azure/azure-sdk-for-go/{service-dir}/armcontainerstorage"
    fix-const-stuttering: true
    flavor: "azure"
    generate-samples: true
    generate-fakes: true
    head-as-boolean: true
    inject-spans: true
